<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-cone color="gray" position="0 2 -5" rotation="0 45 45" scale="2 2 2"></a-cone>
      <a-sphere color="cyan" position="0 2 -5" scale="1 1 1"></a-sphere>
      <a-sky src="https://media.istockphoto.com/id/1328689113/photo/summer-blue-sky-and-white-cloud-white-background-beautiful-clear-cloudy-in-sunlight-calm.jpg?s=612x612&w=0&k=20&c=37qEuwdxyQSx9kuS-_Gz0WiKFX6jMXZN9aRY47mN2vI="></a-sky>
      <a-cylinder color="red" position="5 2 -6" rotation="0 22 22" scale="1 2 1"></a-cylinder> 
      <a-entity camera look-controls wasd-controls position="0 1.6 0"></a-entity>
    </a-scene>
  </body>
</html>
